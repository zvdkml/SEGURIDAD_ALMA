<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alma Security - Central Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <div class="container mx-auto px-4 py-10">
        <header class="mb-10 flex justify-between items-center">
            <div>
                <h1 class="text-4xl font-black tracking-tight text-blue-600">ALMA <span class="text-gray-900 uppercase">Monitor</span></h1>
                <p class="text-gray-500 font-medium">Panel de monitorización centralizado para múltiples sitios.</p>
            </div>
            <button onclick="loadSites()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-md transition">Actualizar</button>
        </header>

        <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-50 text-[10px] font-black text-gray-400 uppercase tracking-widest border-b">
                        <th class="px-6 py-4">Dominio</th>
                        <th class="px-6 py-4">WordPress</th>
                        <th class="px-6 py-4">PHP</th>
                        <th class="px-6 py-4">Plugins Activos</th>
                        <th class="px-6 py-4">Última Conexión</th>
                        <th class="px-6 py-4 text-center">Estado</th>
                    </tr>
                </thead>
                <tbody id="sites-list">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadSites() {
            const response = await fetch("/sites");
            const sites = await response.json();
            const list = document.getElementById("sites-list");
            list.innerHTML = "";

            if (sites.length === 0) {
                list.innerHTML = "<tr><td colspan=\"6\" class=\"px-6 py-10 text-center text-gray-400 italic\">No hay sitios registrados todavía.</td></tr>";
                return;
            }

            sites.forEach(site => {
                const row = document.createElement("tr");
                row.className = "border-b hover:bg-gray-50 transition";

                const lastSeen = new Date(site.last_connection).toLocaleString();
                const pluginsCount = site.active_plugins ? site.active_plugins.length : 0;

                row.innerHTML = `
                    <td class="px-6 py-4 font-bold text-blue-600 underline"><a href="\${site.domain}" target="_blank">\${site.domain}</a></td>
                    <td class="px-6 py-4 text-sm font-medium">\${site.wp_version}</td>
                    <td class="px-6 py-4 text-sm">\${site.php_version}</td>
                    <td class="px-6 py-4 text-sm">
                        <span class="bg-blue-100 text-blue-800 px-2 py-1 rounded-full text-xs font-bold">\${pluginsCount} plugins</span>
                    </td>
                    <td class="px-6 py-4 text-xs font-medium text-gray-500">\${lastSeen}</td>
                    <td class="px-6 py-4 text-center">
                        <span class="inline-block w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.6)]"></span>
                    </td>
                `;
                list.appendChild(row);
            });
        }

        loadSites();
        setInterval(loadSites, 30000); // Auto refresh every 30s
    </script>
</body>
</html>
